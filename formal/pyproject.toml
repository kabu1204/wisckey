[project]
name = "wisckey-formal"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "z3-solver>=4.13,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
